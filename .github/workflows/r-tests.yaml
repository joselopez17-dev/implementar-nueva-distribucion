name: Unit-Weibull R tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies
        run: Rscript -e 'install.packages(c("gamlss", "gamlss.dist"), repos = "https://cloud.r-project.org")'

      - name: Check simulation study script loads
        run: Rscript -e 'source("simulation/estudio_simulacion_UW.R")'

      - name: Run Unit-Weibull tests
        run: Rscript tests/run_all_tests.R
